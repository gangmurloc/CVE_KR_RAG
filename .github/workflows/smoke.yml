name: smoke

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check Python syntax
        run: python -m compileall src scripts
      - name: Check required repository files
        run: |
          test -f README.md
          test -f LICENSE
          test -f config.yaml
          test -f requirements.txt
          test -f .env.example
